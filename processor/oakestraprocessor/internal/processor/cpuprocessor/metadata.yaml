type: oakestraprocessor/cpu

parent: oakestraprocessor

resource_attributes:
  service.name:
    description: service name
    type: string
    enabled: true

  container_id:
    description: container id, which is the full service instance identifier
    type: string
    enabled: true

attributes:
  state:
    description: recorded states
    type: string
    enum: [system, user]

metrics:
  service.cpu.utilisation:
    enabled: true
    description: percentage of total cpu time used by service in certain state
    unit: percent
    gauge:
      value_type: double
    attributes: [state]